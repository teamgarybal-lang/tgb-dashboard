<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Listings board · Harcourts TGB Group</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B1F3A">
<style>
:root{--blue:#00ADEF;--navy:#071630;--mut:#9BB0CC;--row:28px}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
body{background:radial-gradient(900px 480px at 8% -10%, rgba(0,173,239,.28), transparent 50%),linear-gradient(165deg,#071630,#0B1F3A 58%,#0A2748);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;gap:16px;position:relative}
.brand{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1;position:relative;z-index:1}
.brand span{color:var(--blue);font-weight:300;margin-left:.35em}
.board-title{position:absolute;left:50%;transform:translateX(-50%);margin:0;font-size:26px;font-weight:800;letter-spacing:.14em;color:#fff;text-shadow:0 0 18px rgba(0,173,239,.45);white-space:nowrap}
.topnav{display:flex;align-items:center;gap:16px;position:relative;z-index:1}
.topnav a{color:#8FD9F8;font-size:16px;font-weight:700;text-decoration:none}
.meta{text-align:right}.meta b{display:block;font-size:24px;letter-spacing:-.03em;line-height:1}.meta span{color:#fff;font-size:16px;font-weight:700}
.main{height:calc(100% - 64px);display:grid;grid-template-columns:1.15fr .85fr;gap:12px;padding:0 16px 12px}
.panel{background:linear-gradient(180deg,rgba(18,46,86,.98),rgba(8,24,48,.98));border:1px solid rgba(46,196,182,.28);border-radius:18px;padding:8px 12px 8px;display:flex;flex-direction:column;min-height:0;box-shadow:0 16px 36px rgba(0,0,0,.28),0 0 24px rgba(46,196,182,.08)}
.right{display:grid;grid-template-rows:1fr 1fr;gap:10px;min-height:0}
.sub{min-height:0;display:flex;flex-direction:column;border-radius:16px;padding:6px 10px 4px;box-shadow:0 10px 24px rgba(0,0,0,.22)}
.sub.sold{background:linear-gradient(180deg,rgba(10,40,68,.96),rgba(8,22,42,.96));border:1px solid rgba(0,173,239,.28)}
.sub.cond{background:linear-gradient(180deg,rgba(48,32,12,.55),rgba(12,22,40,.96));border:1px solid rgba(227,155,18,.32)}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:26px;margin-bottom:2px;padding:2px 10px;border-radius:8px}
.sec-head.new{background:linear-gradient(90deg,rgba(46,196,182,.42),rgba(46,196,182,.05));box-shadow:0 0 16px rgba(46,196,182,.16)}
.sec-head.sold{background:linear-gradient(90deg,rgba(0,173,239,.45),rgba(0,173,239,.06));box-shadow:0 0 16px rgba(0,173,239,.18)}
.sec-head.cond{background:linear-gradient(90deg,rgba(227,155,18,.48),rgba(227,155,18,.08));box-shadow:0 0 16px rgba(227,155,18,.16)}
h2{margin:0;font-size:20px;line-height:22px;letter-spacing:.08em;font-weight:800;color:#fff}
.sec-head.new h2{color:#B6FFF0}
.sec-head.sold h2{color:#D7F4FF}
.sec-head.cond h2{color:#FFE3A3}
.pg{font-size:14px;font-weight:800;letter-spacing:.04em;font-variant-numeric:tabular-nums;color:#fff}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{text-align:left;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#8FD9F8;font-weight:800;padding:0 8px 2px;white-space:nowrap}
tr.item td{font-size:18px;font-weight:650;height:var(--row);max-height:var(--row);line-height:var(--row);padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;border-top:1px solid rgba(255,255,255,.06)}
tr.item:nth-child(even) td{background:rgba(255,255,255,.045)}
table.listings th:nth-child(1),table.listings td:nth-child(1){width:42%}
table.listings th:nth-child(2),table.listings td:nth-child(2){width:18%}
table.listings th:nth-child(3),table.listings td:nth-child(3){width:16%}
table.listings th:nth-child(4),table.listings td:nth-child(4){width:24%}
table.listings tr.item td:first-child{box-shadow:inset 3px 0 0 #2EC4B6}
table.sold th:nth-child(1),table.sold td:nth-child(1){width:52%}
table.sold th:nth-child(2),table.sold td:nth-child(2){width:20%}
table.sold th:nth-child(3),table.sold td:nth-child(3){width:28%}
table.sold tr.item td:first-child{box-shadow:inset 3px 0 0 var(--blue)}
table.sold td.money{color:#7AD7FF;font-weight:800}
table.cond th:nth-child(1),table.cond td:nth-child(1){width:26%}
table.cond th:nth-child(2),table.cond td:nth-child(2){width:42%}
table.cond th:nth-child(3),table.cond td:nth-child(3){width:18%}
table.cond th:nth-child(4),table.cond td:nth-child(4){width:14%}
table.cond tr.item td:first-child{box-shadow:inset 3px 0 0 #E39B12}
table.cond td.money{color:#FFD27A;font-weight:800}
td.money,th.money{white-space:nowrap;text-overflow:clip}
.line{display:flex;align-items:center;gap:8px;min-width:0;height:var(--row)}
.clip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.badge{flex:0 0 auto;font-size:11px;font-weight:800;letter-spacing:.06em;line-height:16px;padding:0 5px;border-radius:4px;background:var(--blue);color:#fff}
.scroller{overflow:hidden;min-height:0;flex:1}
.empty{color:var(--mut);font-size:18px;font-style:italic;padding:8px 4px}
#err{position:fixed;left:16px;bottom:8px;color:#FCA5A5;font-size:14px}
</style></head><body>
<div class="top">
 <div class="brand">Harcourts <span>TGB Group</span></div>
 <h1 class="board-title">LISTING STOCK BOARD</h1>
 <div class="topnav"><a href="/board/add">Add</a><a href="/board/manage">Manage</a><div class="meta"><b id="clock"></b><span id="monthLabel">Listings board</span></div></div>
</div>
<div class="main">
 <section class="panel" aria-label="Listings">
  <div class="sec-head new"><h2 id="newHead">NEW LISTINGS</h2><span class="pg" id="newPage"></span></div>
  <table class="head listings"><thead><tr><th>Address</th><th>Agent</th><th>CV</th><th>Method of sale</th></tr></thead></table>
  <div class="scroller" id="newScroll" data-scroll><table class="listings"><tbody id="newList"></tbody></table></div>
 </section>
 <div class="right">
  <section class="sub sold" id="soldSection" aria-label="Sold">
   <div class="sec-head sold"><h2 id="soldHead">SOLD LISTINGS</h2><span class="pg" id="soldPage"></span></div>
   <table class="head sold"><thead><tr><th>Address</th><th class="money">Price</th><th>Agent</th></tr></thead></table>
   <div class="scroller" id="soldScroll" data-scroll><table class="sold"><tbody id="soldList"></tbody></table></div>
  </section>
  <section class="sub cond" id="condSection" aria-label="Conditional">
   <div class="sec-head cond"><h2 id="condHead">CONDITIONAL SALES</h2><span class="pg" id="condPage"></span></div>
   <table class="head cond"><thead><tr><th>Address</th><th>Conditions</th><th>Agent</th><th class="money">Price</th></tr></thead></table>
   <div class="scroller" id="condScroll" data-scroll><table class="cond"><tbody id="condList"></tbody></table></div>
  </section>
 </div>
</div>
<div id="err"></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const METHOD={auction:'Auction',negotiation:'Price by Negotiation',deadline:'Deadline Sale',price:'Price'};
const ROW=28;
function place(it){const a=it.address||'',s=it.suburb||'';if(!s||a.toLowerCase().includes(s.toLowerCase()))return a;return a+', '+s}
function methodLine(it){
 if(it.method==='price')return it.asking_price?`Price ${it.asking_price}`:'Price';
 if(METHOD[it.method])return METHOD[it.method];
 return it.asking_price||'—';
}
function dash(v){return v?esc(v):'—'}
function firstName(name){
 const parts=String(name||'').trim().split(/\s+/).filter(Boolean);
 return parts[0]||'';
}
function agents(it){
 const a=firstName(it.agent), b=firstName(it.agent2);
 if(a&&b)return a+' & '+b;
 return a||b;
}
function newRow(it){
 return `<tr class="item"><td>${esc(place(it))}</td><td>${dash(agents(it))}</td><td>${dash(it.cv)}</td><td>${esc(methodLine(it))}</td></tr>`;
}
function soldRow(it){
 return `<tr class="item"><td><div class="line"><span class="badge">SOLD</span><span class="clip">${esc(place(it))}</span></div></td><td class="money">${dash(it.sale_price)}</td><td>${dash(agents(it))}</td></tr>`;
}
function condRow(it){
 return `<tr class="item"><td>${esc(place(it))}</td><td>${dash(it.condition_text)}</td><td>${dash(agents(it))}</td><td class="money">${dash(it.cond_price)}</td></tr>`;
}
function fill(id, rows, render){
 document.getElementById(id).innerHTML=rows.length?rows.map(render).join(''):'';
}
function emptyNote(scrollId, rows){
 const host=document.getElementById(scrollId);
 let note=host.querySelector('.empty');
 if(rows.length){if(note)note.remove();return}
 if(!note){note=document.createElement('div');note.className='empty';note.textContent='No listings yet';host.prepend(note)}
}
function applySplit(soldN, condN){
 const right=document.querySelector('.right');
 if(!soldN&&!condN) right.style.gridTemplateRows='1fr 1fr';
 else if(!soldN) right.style.gridTemplateRows='64px minmax(0,1fr)';
 else if(!condN) right.style.gridTemplateRows='minmax(0,1fr) 64px';
 else right.style.gridTemplateRows=`minmax(0,${soldN}fr) minmax(0,${condN}fr)`;
}
function tick(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('en-NZ',{timeZone:'Pacific/Auckland',hour:'numeric',minute:'2-digit'})}
async function load(){
 try{
  const r=await fetch('/api/board',{cache:'no-store'});
  if(r.status===401){location.replace('/login?next=/board');return}
  if(r.status===403){location.replace('/board');return}
  if(!r.ok)throw new Error('reload');
  const d=await r.json();
  const fresh=d.new||[], sold=d.sold||[], cond=d.conditional||[];
  fill('newList', fresh, newRow);
  fill('soldList', sold, soldRow);
  fill('condList', cond, condRow);
  emptyNote('newScroll', fresh);
  emptyNote('soldScroll', sold);
  emptyNote('condScroll', cond);
  document.getElementById('monthLabel').textContent=d.month_label||'Listings board';
  document.getElementById('newHead').textContent=`NEW LISTINGS · ${fresh.length}`;
  document.getElementById('soldHead').textContent=`SOLD LISTINGS · ${sold.length}`;
  document.getElementById('condHead').textContent=`CONDITIONAL SALES · ${cond.length}`;
  applySplit(sold.length, cond.length);
  document.getElementById('err').textContent='';
  pageIndex.newScroll=pageIndex.soldScroll=pageIndex.condScroll=0;
  requestAnimationFrame(()=>requestAnimationFrame(()=>showPages(false)));
 }catch(e){document.getElementById('err').textContent='Reconnecting…'}
}
const pageIndex={newScroll:0,soldScroll:0,condScroll:0};
function showPages(advance){
 document.querySelectorAll('[data-scroll]').forEach(el=>{
  const items=[...el.querySelectorAll('tr.item')];
  const label=document.getElementById(el.id.replace('Scroll','Page'));
  if(!items.length){if(label)label.textContent='';return}
  const avail=el.clientHeight;
  if(avail<ROW) return;
  const fit=Math.max(1, Math.floor(avail/ROW));
  const pages=Math.ceil(items.length/fit);
  let page=pageIndex[el.id]||0;
  if(advance) page=(page+1)%pages;
  if(page>=pages) page=0;
  pageIndex[el.id]=page;
  const from=page*fit, to=from+fit;
  items.forEach((item,idx)=>{item.style.display=idx>=from&&idx<to?'':'none'});
  if(label) label.textContent=pages>1?`${page+1}/${pages}`:'';
 });
}
setInterval(()=>showPages(true),12000);
tick();setInterval(tick,10000);load();setInterval(load,6*60*1000);
setTimeout(()=>location.reload(),6*3600e3);
</script></body></html>
