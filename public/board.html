<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Listings board · Harcourts TGB Group</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B1F3A">
<style>
:root{--blue:#00ADEF;--navy:#071630;--mut:#9BB0CC}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
body{background:radial-gradient(900px 480px at 8% -10%, rgba(0,173,239,.28), transparent 50%),linear-gradient(165deg,#071630,#0B1F3A 58%,#0A2748);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.top{height:84px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:16px}
.brand{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1}
.brand span{color:var(--blue);font-weight:300;margin-left:.35em}
.topnav{display:flex;align-items:center;gap:18px}
.topnav a{color:#8FD9F8;font-size:16px;font-weight:700;text-decoration:none}
.meta{text-align:right}.meta b{display:block;font-size:30px;letter-spacing:-.03em;line-height:1}.meta span{color:var(--mut);font-size:16px}
.main{height:calc(100% - 84px);display:grid;grid-template-columns:1.15fr .85fr;gap:18px;padding:0 22px 18px}
.panel{background:linear-gradient(180deg,rgba(16,40,76,.96),rgba(10,28,54,.96));border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:18px 16px 12px;display:flex;flex-direction:column;min-height:0;box-shadow:0 16px 40px rgba(0,0,0,.22)}
.right{display:grid;grid-template-rows:1.2fr .9fr;gap:14px;min-height:0}
.sub{min-height:0;display:flex;flex-direction:column;background:rgba(0,0,0,.16);border-radius:16px;padding:12px 12px 8px}
h2{margin:0 0 8px;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:#8FD9F8;font-weight:800}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{text-align:left;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:#8FD9F8;font-weight:800;padding:0 10px 8px}
td{font-size:26px;font-weight:750;letter-spacing:-.02em;line-height:1.2;padding:12px 10px;vertical-align:top;border-top:1px solid rgba(255,255,255,.08);overflow-wrap:anywhere}
table.listings th:nth-child(1),table.listings td:nth-child(1){width:34%}
table.listings th:nth-child(2),table.listings td:nth-child(2){width:28%}
table.listings th:nth-child(3),table.listings td:nth-child(3){width:14%}
table.listings th:nth-child(4),table.listings td:nth-child(4){width:24%}
table.listings td:nth-child(2){overflow-wrap:break-word}
table.cond th,table.cond td{font-size:20px;line-height:1.25;padding:10px 8px;overflow-wrap:break-word}
table.cond th:nth-child(1),table.cond td:nth-child(1){width:38%}
table.cond th:nth-child(2),table.cond td:nth-child(2){width:24%}
table.cond th:nth-child(3),table.cond td:nth-child(3){width:22%}
table.cond th:nth-child(4),table.cond td:nth-child(4){width:16%}
table.cond td.money,table.cond th.money{white-space:nowrap;overflow-wrap:normal}
td.addr{font-size:28px;font-weight:800}
table.cond td.addr{font-size:22px}
.scroller{overflow:hidden;min-height:0;flex:1}
.head th{padding-top:0}
.item{background:rgba(0,0,0,.28);border-radius:16px;padding:14px 16px 12px;margin-bottom:12px;border-left:5px solid var(--blue)}
.addrline{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.agent{margin-top:8px;font-size:22px;line-height:1.3;color:#E7F6FD;font-weight:650}
.who,.who2{display:block}
.who2{margin-top:2px}
.sale{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.badge{display:inline-block;font-size:20px;font-weight:800;letter-spacing:.08em;padding:5px 12px;border-radius:8px;line-height:1.1;background:var(--blue);color:#fff}
.price{font-size:30px;font-weight:800;letter-spacing:-.03em}
.empty{color:var(--mut);font-size:26px;font-style:italic;padding:12px 4px}
#err{position:fixed;left:22px;bottom:10px;color:#FCA5A5;font-size:16px}
</style></head><body>
<div class="top">
 <div class="brand">Harcourts <span>TGB Group</span></div>
 <div class="topnav"><a href="/board/add">Add</a><a href="/board/manage">Manage</a><div class="meta"><b id="clock"></b><span>Listings board</span></div></div>
</div>
<div class="main">
 <section class="panel" aria-label="Listings">
  <table class="head listings"><thead><tr><th>Address</th><th>Agent</th><th>CV</th><th>Method of sale</th></tr></thead></table>
  <div class="scroller" id="newScroll" data-scroll><table class="listings"><tbody id="newList"></tbody></table></div>
 </section>
 <div class="right">
  <section class="sub" aria-label="Sold">
   <h2>Sold</h2>
   <div class="scroller" id="soldScroll" data-scroll><div id="soldList"></div></div>
  </section>
  <section class="sub" aria-label="Conditional">
   <h2>Conditional</h2>
   <table class="head cond"><thead><tr><th>Address</th><th>Conditions</th><th>Agent</th><th class="money">Price</th></tr></thead></table>
   <div class="scroller" id="condScroll" data-scroll><table class="cond"><tbody id="condList"></tbody></table></div>
  </section>
 </div>
</div>
<div id="err"></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const METHOD={auction:'Auction',negotiation:'Price by Negotiation',deadline:'Deadline Sale',price:'Price'};
function place(it){const a=it.address||'',s=it.suburb||'';if(!s||a.toLowerCase().includes(s.toLowerCase()))return a;return a+', '+s}
function methodLine(it){
 if(it.method==='price')return it.asking_price?`Price ${it.asking_price}`:'Price';
 if(METHOD[it.method])return METHOD[it.method];
 return it.asking_price||'—';
}
function dash(v){return v?esc(v):'—'}
function agentLines(it){
 const a=String(it.agent||'').trim();
 const b=String(it.agent2||'').trim();
 if(a&&b)return `<span class="who">${esc(a)}</span><span class="who2">&amp; ${esc(b)}</span>`;
 return a||b?esc(a||b):'—';
}
function newRow(it){
 return `<tr class="item"><td class="addr">${esc(place(it))}</td><td>${agentLines(it)}</td><td>${dash(it.cv)}</td><td>${esc(methodLine(it))}</td></tr>`;
}
function soldCard(it){
 const who=String(it.agent||'').trim()||String(it.agent2||'').trim();
 return `<article class="item sold"><div class="sale"><span class="badge sold">SOLD</span>${it.sale_price?`<span class="price">${esc(it.sale_price)}</span>`:''}</div><div class="addrline">${esc(place(it))}</div>${who?`<div class="agent">${agentLines(it)}</div>`:''}</article>`;
}
function condRow(it){
 return `<tr class="item"><td class="addr">${esc(place(it))}</td><td>${dash(it.condition_text)}</td><td>${agentLines(it)}</td><td class="money">${dash(it.cond_price)}</td></tr>`;
}
function fill(id, rows, render){
 document.getElementById(id).innerHTML=rows.length?rows.map(render).join(''):'';
}
function emptyNote(scrollId, rows){
 const host=document.getElementById(scrollId);
 let note=host.querySelector('.empty');
 if(rows.length){if(note)note.remove();return}
 if(!note){note=document.createElement('div');note.className='empty';note.textContent='No listings yet';host.prepend(note)}
}
function tick(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('en-NZ',{timeZone:'Pacific/Auckland',hour:'numeric',minute:'2-digit'})}
async function load(){
 try{
  const r=await fetch('/api/board',{cache:'no-store'});
  if(r.status===401){location.replace('/login?next=/board');return}
  if(r.status===403){location.replace('/board');return}
  if(!r.ok)throw new Error('reload');
  const d=await r.json();
  const fresh=d.new||[], sold=d.sold||[], cond=d.conditional||[];
  fill('newList', fresh, newRow);
  fill('soldList', sold, soldCard);
  fill('condList', cond, condRow);
  emptyNote('newScroll', fresh);
  emptyNote('soldScroll', sold);
  emptyNote('condScroll', cond);
  document.getElementById('err').textContent='';
  pageIndex.newScroll=pageIndex.soldScroll=pageIndex.condScroll=0;
  document.querySelectorAll('[data-scroll]').forEach(el=>{delete el._heights});
  requestAnimationFrame(()=>showPages(false));
 }catch(e){document.getElementById('err').textContent='Reconnecting…'}
}
const pageIndex={newScroll:0,soldScroll:0,condScroll:0};
function showPages(advance){
 document.querySelectorAll('[data-scroll]').forEach(el=>{
  const items=[...el.querySelectorAll('.item')];
  if(!items.length)return;
  if(!el._heights){
   items.forEach(item=>item.style.display='');
   el._heights=items.map(item=>item.offsetHeight||40);
  }
  const avail=el.clientHeight||1;
  const ranges=[];
  let i=0;
  while(i<items.length){
   let used=0;
   const start=i;
   while(i<items.length && (i===start || used+el._heights[i]<=avail)){
    used+=el._heights[i]+12;
    i++;
   }
   ranges.push([start,i]);
  }
  let page=pageIndex[el.id]||0;
  if(advance)page=(page+1)%ranges.length;
  if(page>=ranges.length)page=0;
  pageIndex[el.id]=page;
  const [from,to]=ranges[page];
  items.forEach((item,idx)=>{item.style.display=idx>=from&&idx<to?'':'none'});
 });
}
setInterval(()=>showPages(true),20000);
tick();setInterval(tick,10000);load();setInterval(load,6*60*1000);
setTimeout(()=>location.reload(),6*3600e3);
</script></body></html>
